name: Native Windows desktop acceptance
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to accept
        required: false
        default: main
  pull_request:
    paths:
      - '.github/workflows/desktop-acceptance.yml'
      - 'scripts/acceptance/**'
      - 'integrations/hermes-client/**'
permissions:
  contents: read
concurrency:
  group: windows-native-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
      - name: Probe actual Office and GDI before native preparation
        run: |
          New-Item -ItemType Directory -Force acceptance-results | Out-Null
          & scripts/acceptance/windows-office.ps1 -OutputDirectory (Join-Path $PWD 'acceptance-results')
          & scripts/acceptance/windows-gdi.ps1 -ReportPath (Join-Path $PWD 'acceptance-results/windows-gdi-report.json') -ImagePath (Join-Path $PWD 'acceptance-results/windows-gdi-diagnostic-fixture.png')
      - name: Publish same-session GDI preflight evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-preflight-${{ github.run_id }}
          path: acceptance-results/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate native acceptance scripts
        run: |
          node --check scripts/acceptance/native-desktop.mjs
          node --check scripts/acceptance/misaka-final.mjs
          node --check scripts/acceptance/capture-environment.mjs
          node --check scripts/acceptance/dialog-environment.mjs
          node --check scripts/probe_native_backend.mjs
          Get-ChildItem scripts/acceptance/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell acceptance script failed to parse: $($_.Name)" }
          }
      - name: Locate public npm content cache
        id: npm-cache-location
        run: |
          $npmContentCache = Join-Path (npm config get cache) '_cacache'
          "path=$npmContentCache" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-location.outputs.path }}
          key: windows-native-public-npm-node24-${{ hashFiles('integrations/hermes-client/upstream.json') }}
      - name: Prepare actual pinned native runtime and application
        id: native-preparation
        run: |
          python -m pip install -r requirements.txt
          $nativePreparedLines = python scripts/prepare_native_client.py --cache-dir "$env:RUNNER_TEMP/native-source" --hermes-home "$env:RUNNER_TEMP/native-profile" --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativePreparedJson = $nativePreparedLines -join [Environment]::NewLine
          $nativePreparedJson | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'native-preparation.json')
          $nativePrepared = $nativePreparedJson | ConvertFrom-Json
          if (-not $nativePrepared.native_runtime.ready -or -not $nativePrepared.native_built) { throw 'Actual native preparation did not establish readiness.' }
          "source=$($nativePrepared.checkout)" >> $env:GITHUB_OUTPUT
          "launcher=$($nativePrepared.native_runtime.launcher)" >> $env:GITHUB_OUTPUT
      - name: Cache public npm package bytes only
        if: always() && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.npm-cache-location.outputs.path }}
          key: windows-native-public-npm-node24-${{ hashFiles('integrations/hermes-client/upstream.json') }}
      - name: Install actual pointer ZIP and exercise extracted Agent Skill against the same runtime
        timeout-minutes: 10
        run: |
          & scripts/acceptance/windows-package-and-skill.ps1 -Repository $PWD -Source "${{ steps.native-preparation.outputs.source }}" -Launcher "${{ steps.native-preparation.outputs.launcher }}" -ProfileDirectory "$env:RUNNER_TEMP/native-profile" -OutputDirectory (Join-Path $PWD 'acceptance-results')
      - name: Actual Electron launch, native capture and screenshots
        timeout-minutes: 8
        run: |
          node scripts/acceptance/native-desktop.mjs --upstream "${{ steps.native-preparation.outputs.source }}" --native-launcher "${{ steps.native-preparation.outputs.launcher }}" --hermes-home "$env:RUNNER_TEMP/native-profile" --output acceptance-results
      - name: Verify the confirmed draft never submitted a native message
        run: |
          python scripts/acceptance/verify-unsent-draft.py --profile-home "$env:RUNNER_TEMP/native-profile" --report acceptance-results/unsent-draft-db-report.json
      - name: Upload only screenshots and redacted acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-acceptance-${{ github.run_id }}
          path: acceptance-results/
          retention-days: 14
          if-no-files-found: error
